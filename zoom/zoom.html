<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Consolas', 'Cascadia Mono', monospace;
    }
    .backdrop {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 24px;
      background: rgba(10, 12, 11, 0.94);
      border: 1px solid rgba(232, 163, 61, 0.5);
      border-radius: 4px;
      position: relative;
      -webkit-app-region: drag;
      cursor: zoom-out;
    }
    #zoomed {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      bottom: 24px;
      width: calc(100% - 48px);
      height: calc(100% - 48px);
      object-fit: cover;
      object-position: center;
      border-radius: 2px;
      -webkit-app-region: no-drag;
    }
    .hint {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 10px;
      letter-spacing: 1px;
      color: #8b9088;
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop">
    <img id="zoomed" src="" alt="" />
    <div class="hint">CLICK ANYWHERE OR F8 TO CLOSE</div>
  </div>
  <script src="zoom-renderer.js"></script>
</body>
</html>
